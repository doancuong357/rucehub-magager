services:
  - type: web
    name: ricehub-manager
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        placeholder: "Ví dụ: postgres://postgres.yourdb:password@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require"
